<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>社内通知の確認表</title><style>
:root{font-family:system-ui,-apple-system,"Yu Gothic UI",sans-serif;color:#203333;background:#f4f7f7;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:11px 16px;background:#eef3f2;color:#34504a}button:hover{filter:brightness(.96)}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #69c6b2;outline-offset:2px}.shell{display:flex;min-height:100vh}aside{width:224px;background:#fff;border-right:1px solid #e0e9e6;padding:35px 22px;flex-shrink:0}.brand{font-weight:800;font-size:23px;letter-spacing:2px}.brand>span:first-child{display:inline-grid;place-items:center;background:#177d68;color:white;width:34px;height:34px;border-radius:11px;margin-right:8px}.small{display:block;font-size:11px;letter-spacing:1px;font-weight:500;margin:13px 0 40px}nav{display:grid;gap:10px}nav button{text-align:left;background:transparent}nav button.active{background:#e7f4ef;color:#14765f;font-weight:700}.side-note{margin-top:80px;color:#7b8d87;font-size:12px;line-height:1.9}main{padding:38px 44px;width:100%;max-width:1300px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:15px}.eyebrow{font-size:10px;letter-spacing:2px;color:#6b9084}h1{font-size:30px;margin:10px 0}p{color:#71827d;line-height:1.7}.primary{background:#177d68;color:white}.banner{background:#e9f1ef;border-radius:10px;padding:12px 16px;font-size:12px;margin:20px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:25px 0}.stat{padding:22px;background:#fff;border:1px solid #e0e9e6;border-radius:14px}.stat strong{display:block;font-size:30px;margin-top:10px}.stat small{color:#82928c}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:26px 0}.toolbar #tabs{margin-right:auto}.toolbar button{background:transparent}.toolbar button.active{background:#dceee7;color:#14765f}.toolbar input{max-width:210px}input,select,textarea{border:1px solid #d7e2dd;background:white;border-radius:8px;padding:11px;color:#203333;width:100%}.toolbar select{width:auto}.card{background:white;border:1px solid #e0e9e6;border-radius:15px;margin-bottom:16px;padding:25px}.card-top{display:flex;justify-content:space-between;gap:12px;align-items:center}.tag{font-size:11px;background:#edf3f1;color:#5e7d70;padding:5px 9px;border-radius:5px}.tag.done{background:#e0f3e9;color:#168060}.tag.warn{background:#fff0da;color:#a16c17}h2{font-size:19px;margin:15px 0 8px}.meta{font-size:12px;color:#84928c}.body{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.9;margin:20px 0;color:#40574f}.progress{height:6px;border-radius:9px;background:#edf2f0;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:#39a888}.card-bottom{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.muted{color:#7d8f87;font-size:12px}details{border-top:1px solid #edf1ef;margin-top:20px;padding-top:15px}summary{cursor:pointer;font-size:12px;color:#537367}.people{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px}.person{padding:9px 0;border-bottom:1px solid #edf1ef;font-size:12px;overflow-wrap:anywhere}.empty{text-align:center;padding:55px 20px;background:white;border:1px dashed #cbdcd4;border-radius:14px}.chart-row{display:flex;gap:10px;align-items:center;margin:15px 0;font-size:12px}.chart-row>span{width:48px}.bar{flex:1;display:flex;height:22px;background:#edf2f0;border-radius:5px;overflow:hidden}.bar .yes{background:#37a584}.bar .no{background:#e6b870}.chart-row>b{width:95px;text-align:right;font-size:11px}table{border-collapse:collapse;width:100%;font-size:12px}td,th{text-align:left;padding:13px 8px;border-bottom:1px solid #e5ede8}.table-wrap{overflow:auto}footer{font-size:11px;color:#85968e;margin:32px 0;line-height:1.8}dialog{border:0;border-radius:18px;padding:28px;width:min(560px,94vw);max-height:90vh;box-shadow:0 20px 100px #183b4333}dialog::backdrop{background:#1a343877}label{display:block;margin:16px 0;font-size:13px}label input,label textarea,label select{margin-top:8px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:15px}.dialog-top{display:flex;justify-content:space-between;align-items:center}.hint{display:block;font-size:11px;color:#7a8e85;margin:7px 0}#targets label{display:inline-flex;align-items:center;gap:7px;margin:8px 12px 8px 0}#targets input{width:auto;margin:0}#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#234a40;color:white;padding:12px 22px;border-radius:10px;display:none;z-index:5}#form-error{color:#ab5145}@media(max-width:760px){.shell{display:block}aside{width:100%;padding:18px;border-right:0;border-bottom:1px solid #e0e9e6}.brand{font-size:18px}.small,.side-note{display:none}nav{display:flex;margin-top:15px;gap:5px}nav button{flex:1;text-align:center;font-size:12px;padding:10px}main{padding:22px 16px}header{align-items:flex-start}h1{font-size:25px}header p{font-size:12px}header .primary{font-size:12px;white-space:nowrap;padding:12px 10px}.stats{gap:8px}.stat{padding:14px 10px;font-size:11px}.stat strong{font-size:24px}.card{padding:19px}.toolbar input{max-width:none;flex:1;min-width:150px}.people{grid-template-columns:1fr}.eyebrow{font-size:8px}.fields{grid-template-columns:1fr}}

</style></head>
<body><div class="shell"><aside><div class="brand"><span>✓</span> NOTICE<span class="small">社内通知の確認表</span></div><nav><button data-view="notices" class="active">▤ お知らせ</button><button data-view="history">▥ 記録・グラフ</button><button data-view="members">♙ メンバー</button></nav><div class="side-note">読む、その先へ。<br>内容の確認をみんなで共有。</div></aside><main><header><div><span class="eyebrow">TEAM ACKNOWLEDGEMENT</span><h1 id="heading">お知らせ</h1><p>既読とは別に、内容を確認したことを記録します。</p></div><button class="primary" id="new">＋ お知らせを作成</button></header><div id="mode" class="banner"></div><section class="stats" id="stats"></section><section class="toolbar"><div id="tabs"><button data-filter="all" class="active">すべて</button><button data-filter="todo">自分の未確認</button></div><input id="search" placeholder="お知らせを検索" aria-label="お知らせを検索"><select id="year" aria-label="年"></select><select id="month" aria-label="月"><option value="">すべての月</option></select></section><div id="content"></div><footer>確認は本人の操作による自己申告です。同期した記録をメンバーで共有します。</footer></main></div><dialog id="editor"><form id="notice-form"><div class="dialog-top"><h2>お知らせを作成</h2><button type="button" id="close" aria-label="閉じる">×</button></div><label>タイトル<input name="title" required maxlength="100" placeholder="例：今月の安全確認について"></label><label>お知らせの内容<textarea name="body" required maxlength="12000" rows="6" placeholder="確認してほしい内容を記入してください"></textarea></label><div class="fields"><label>分類<select name="category"><option>業務連絡</option><option>安全・衛生</option><option>社内規程</option><option>研修</option><option>その他</option></select></label><label>確認期限<input name="due" type="date" required></label></div><label>確認対象<span class="hint">現在登録されているメンバーを選択。公開後の対象者は固定されます。</span><div id="targets"></div></label><p id="form-error" role="alert"></p><button class="primary" type="submit">お知らせを共有</button></form></dialog><div id="toast" role="status"></div><script>
'use strict';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const live=!!window.webxdc, demoKey='notice-demo-v1';
let events=[];try{if(!live)events=JSON.parse(localStorage.getItem(demoKey)||'[]')}catch{}
const self=live?webxdc.selfAddr:'demo-self', name=live?webxdc.selfName:'あなた（プレビュー）';
let members=new Map(),notices=new Map(),acks=new Map(),view='notices',filter='all',ready=false,pending=new Set(),queue=[],lastSent=0;
const uid=()=>crypto.randomUUID(), date=t=>new Date(t).toLocaleString('ja-JP'), day=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
function apply(p){if(!p||p.v!==1||typeof p.id!=='string')return;if(p.type==='member'&&typeof p.actor==='string'&&typeof p.name==='string')members.set(p.actor,{id:p.actor,name:p.name,time:p.time});if(p.type==='notice'&&typeof p.title==='string'&&typeof p.body==='string'&&Array.isArray(p.targets)&&p.targets.every(x=>x&&typeof x.id==='string'&&typeof x.name==='string')&&!notices.has(p.id))notices.set(p.id,p);if(p.type==='ack'&&typeof p.notice==='string'&&typeof p.actor==='string'){const k=p.notice+'|'+p.actor;if(!acks.has(k))acks.set(k,p);}pending.delete(p.id);}
function receive(p){apply(p);render()}
function send(p){p={...p,v:1,id:uid(),actor:self,name,time:Date.now()};if(!live){events.push(p);localStorage.setItem(demoKey,JSON.stringify(events));receive(p);return p.id}pending.add(p.id);queue.push(p);flush();return p.id}
function flush(){if(!queue.length)return;const wait=Math.max(0,lastSent+(webxdc.sendUpdateInterval||10000)-Date.now());if(wait){clearTimeout(flush.timer);flush.timer=setTimeout(flush,wait);return}const p=queue.shift();try{webxdc.sendUpdate({payload:p,document:'社内通知の確認表'},'');lastSent=Date.now();toast('共有を送信しました。同期を待っています。')}catch(e){pending.delete(p.id);toast('送信できませんでした。もう一度操作してください。')}render();if(queue.length)flush()}
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').style.display='none',4200)}
function acked(n,m){return acks.get(n.id+'|'+m.id)}
function count(n){return n.targets.filter(m=>acked(n,m)).length}
function selected(){return [...notices.values()].filter(n=>(!$('#year').value||new Date(n.time).getFullYear()==$('#year').value)&&(!$('#month').value||new Date(n.time).getMonth()+1==$('#month').value)&&n.title.toLowerCase().includes($('#search').value.toLowerCase())).sort((a,b)=>b.time-a.time)}
function render(){const prev=$('#year').value,years=[...new Set([...notices.values()].map(n=>new Date(n.time).getFullYear()))].sort((a,b)=>b-a);$('#year').innerHTML='<option value="">すべての年</option>'+years.map(y=>`<option>${y}</option>`).join('');$('#year').value=prev;$('#heading').textContent={notices:'お知らせ',history:'記録・グラフ',members:'メンバー'}[view];$('#mode').textContent=live?`${name} として利用中 · ${ready?'共有記録を読み込み済み':'共有記録を読み込み中'}${pending.size?' · 送信・同期待ち '+pending.size+'件':''}`:'ブラウザプレビュー · この端末だけに保存されます。Delta Chatではメンバーと同期します。';$('#new').disabled=!ready;$('#tabs').hidden=view!=='notices';
const ns=selected(),total=ns.reduce((s,n)=>s+n.targets.length,0),done=ns.reduce((s,n)=>s+count(n),0),todo=ns.filter(n=>n.targets.some(m=>m.id===self)&&!acks.has(n.id+'|'+self)).length;
$('#stats').innerHTML=[['お知らせ',ns.length,'選択した期間'],['内容の確認率',total?Math.round(done/total*100)+'%':'—',`${done} / ${total} 件の確認`],['自分の未確認',todo,'本人の確認操作が必要']].map(([a,b,c])=>`<div class="stat">${a}<strong>${b}</strong><small>${c}</small></div>`).join('');
if(view==='members'){const joined=members.has(self);$('#content').innerHTML=`<div class="card"><h2>確認表に参加する</h2><p>同報メンバー全員が一度参加登録してください。登録後、新しい通知の確認対象として選べます。</p><button id="join" class="primary" ${joined||!ready?'disabled':''}>${joined?'参加登録済み':'自分を参加登録'}</button><p class="hint">チャットのメンバー一覧は自動取得できません。未登録の人は未確認者一覧に含まれません。</p></div><div class="card"><h2>登録メンバー · ${members.size}人</h2>${[...members.values()].map(m=>`<div class="person">${esc(m.name)} ${m.id===self?'・あなた':''}</div>`).join('')||'<p>まだ登録メンバーがいません。</p>'}</div>`;$('#join').onclick=()=>{send({type:'member'});$('#join').disabled=true};return}
if(view==='history'){renderHistory(ns);return}
const shown=ns.filter(n=>filter!=='todo'||n.targets.some(m=>m.id===self)&&!acks.has(n.id+'|'+self));$('#content').innerHTML=shown.map(n=>{const c=count(n),mine=n.targets.some(m=>m.id===self),ack=acks.get(n.id+'|'+self),late=n.due<day()&&c<n.targets.length;return `<article class="card"><div class="card-top"><span class="tag">${esc(n.category)}</span><span class="tag ${c===n.targets.length?'done':late?'warn':''}">${c===n.targets.length?'全員確認済み':late?'期限を過ぎています':'確認受付中'}</span></div><h2>${esc(n.title)}</h2><div class="meta">${esc(n.name)} · ${date(n.time)}　／　確認期限 ${esc(n.due)}</div><div class="body">${esc(n.body)}</div><div class="card-bottom"><div><b>${c} / ${n.targets.length} 人が確認済み</b><div class="muted">${ack?'あなたは '+date(ack.time)+' に確認済み':mine?'内容を確認してからボタンを押してください':'あなたはこの通知の確認対象ではありません'}</div></div><button class="${ack?'':'primary'}" data-ack="${esc(n.id)}" ${!mine||ack||!ready?'disabled':''}>${ack?'✓ 確認済み':'内容を確認しました'}</button></div><div class="progress"><div style="width:${c/n.targets.length*100}%"></div></div><details><summary>確認済み・未確認者の一覧を見る</summary><div class="people"><div><b>✓ 確認済み (${c})</b>${n.targets.filter(m=>acked(n,m)).map(m=>`<div class="person">${esc(m.name)}<br><span class="muted">${date(acked(n,m).time)}</span></div>`).join('')||'<p>まだいません</p>'}</div><div><b>未確認 (${n.targets.length-c})</b>${n.targets.filter(m=>!acked(n,m)).map(m=>`<div class="person">${esc(m.name)}</div>`).join('')||'<p>全員が確認済みです</p>'}</div></div></details></article>`}).join('')||'<div class="empty"><h2>お知らせはありません</h2><p>メンバーを登録して、最初のお知らせを共有しましょう。</p></div>';
document.querySelectorAll('[data-ack]').forEach(b=>b.onclick=()=>{send({type:'ack',notice:b.dataset.ack});b.disabled=true;b.textContent='共有待ち…'});
}
function renderHistory(ns){const buckets=new Map();ns.forEach(n=>{const d=new Date(n.time),key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;const b=buckets.get(key)||{total:0,done:0};b.total+=n.targets.length;b.done+=count(n);buckets.set(key,b)});$('#content').innerHTML=`<div class="card"><div class="card-top"><h2>月別の確認状況</h2><button id="export">CSVを出力</button></div><p class="hint">通知の作成月で集計 · 緑：確認済み ／ 黄：未確認<br>年を選ぶと年間の記録を表示できます。確認率は現在までの累計です。</p>${[...buckets].sort().map(([k,b])=>`<div class="chart-row"><span>${k}</span><div class="bar" role="img" aria-label="${k} 確認済み${b.done} 未確認${b.total-b.done}"><div class="yes" style="width:${b.done/b.total*100}%"></div><div class="no" style="width:${(b.total-b.done)/b.total*100}%"></div></div><b>${b.done}/${b.total} · ${Math.round(b.done/b.total*100)}%</b></div>`).join('')||'<p>この期間の記録はありません。</p>'}</div><div class="card table-wrap"><table><thead><tr><th>作成日</th><th>お知らせ</th><th>確認済み</th><th>未確認</th><th>確認率</th></tr></thead><tbody>${ns.map(n=>`<tr><td>${date(n.time)}</td><td>${esc(n.title)}</td><td>${count(n)}人</td><td>${n.targets.length-count(n)}人</td><td>${Math.round(count(n)/n.targets.length*100)}%</td></tr>`).join('')}</tbody></table></div>`;$('#export').onclick=()=>exportCSV(ns)}
function exportCSV(ns){const rows=[['お知らせ','分類','作成日時','確認期限','対象者','状況','確認日時']];ns.forEach(n=>n.targets.forEach(m=>rows.push([n.title,n.category,date(n.time),n.due,m.name,acked(n,m)?'確認済み':'未確認',acked(n,m)?date(acked(n,m).time):''])));const csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replace(/^[=+@\-\t\r]/,"'$&").replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.href=url;a.download='社内通知の確認記録.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);toast('CSVを出力しました。端末によっては保存に対応していません。')}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));render()});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()});for(let i=1;i<=12;i++)$('#month').add(new Option(i+'月',i));['search','year','month'].forEach(id=>$('#'+id).addEventListener(id==='search'?'input':'change',render));
$('#new').onclick=()=>{if(!members.size){view='members';render();toast('先に自分を参加登録してください。');return}$('#targets').innerHTML=[...members.values()].map(m=>`<label><input type="checkbox" value="${esc(m.id)}" checked>${esc(m.name)}</label>`).join('');$('#form-error').textContent='';$('#notice-form').elements.due.value=day();$('#editor').showModal()};$('#close').onclick=()=>$('#editor').close();$('#notice-form').onsubmit=e=>{e.preventDefault();const f=e.target,targets=[...$('#targets').querySelectorAll('input:checked')].map(x=>members.get(x.value)),title=f.elements.title.value.trim(),body=f.elements.body.value.trim();if(!targets.length||!title||!body){$('#form-error').textContent='タイトル・内容と、1人以上の確認対象を指定してください。';return}const p={type:'notice',title,body,category:f.elements.category.value,due:f.elements.due.value,targets:targets.map(m=>({id:m.id,name:m.name}))};if(new TextEncoder().encode(JSON.stringify(p)).length>(live?(webxdc.sendUpdateMaxSize||128000):128000)-2000){$('#form-error').textContent='内容または対象人数が多すぎます。短くして再度共有してください。';return}send(p);$('#editor').close();f.reset()};
if(live){webxdc.setUpdateListener(u=>receive(u.payload),0).then(()=>{ready=true;render()}).catch(()=>toast('共有記録を読み込めませんでした。アプリを開き直してください。'))}else{events.forEach(apply);ready=true;render()}render();

</script></body></html>
